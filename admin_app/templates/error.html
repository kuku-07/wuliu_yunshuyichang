<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} · 运输异常协作后台</title>
  <link rel="stylesheet" href="/admin/static/admin.css">
</head>
<body class="login-body">
  <div class="login-wrap">
    <div class="card error-card">
      <div class="error-code">{{ code }}</div>
      <h2>{{ message }}</h2>
      <p class="muted">请求编号 {{ request_id }}，如需排查请提供给系统管理员。</p>
      <div class="error-actions">
        <a class="btn btn-primary" href="/admin/kb">返回规则库</a>
        <a class="btn btn-ghost" href="/admin/login">重新登录</a>
      </div>
    </div>
  </div>
</body>
</html>
