<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <title>{% block title %}一线问答{% endblock %} · 运输异常协作</title>
  <link rel="stylesheet" href="/admin/static/admin.css?v={{ asset_version }}">
</head>
<body class="{% block body_class %}{% endblock %} agent-body">
<header class="agent-top">
  <div class="agent-brand">
    <span class="brand-mark">运</span>
    <div>
      <div class="brand-title">异常协作 · 一线问答</div>
      <div class="brand-sub">运输异常与签收协作智能体</div>
    </div>
  </div>
  <div class="agent-user">
    {% if can('kb:edit') or can('users:manage') or can('ops:read') %}
    <a class="btn btn-ghost btn-sm" href="/admin/kb">管理后台</a>
    {% endif %}
    <span class="muted">{{ user.name }}</span>
    <form method="post" action="/admin/logout" class="inline-form">
      <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
      <button class="btn btn-ghost btn-sm" type="submit">退出</button>
    </form>
  </div>
</header>
<main class="agent-main">
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
